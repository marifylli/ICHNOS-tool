[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ichnos-tool"
version = "0.1.0"
description = "ICHNOS: fluorescence images to stress dose and time-since-onset estimates"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
# Image analysis (ichnos_image). Separate from the base install so that a
# model/decoder-only user does not pull scikit-image.
image = ["scikit-image", "pillow", "tifffile"]
# Optional deep-learning segmentation backend.
cellpose = ["cellpose", "torch"]
# Model building and simulation. tellurium is kept for now rather than
# dropping to libroadrunner alone: the migrated builder and simulator run
# exactly as they do in Ichnos_PULSE, so the migration changes no behaviour.
# Swapping the solver entry point is its own change, in its own step.
model = ["python-libsbml", "tellurium", "PyYAML"]
dev = ["pytest"]

[tool.setuptools]
packages = ["ichnos", "ichnos.models", "ichnos_image"]

[tool.setuptools.package-data]
# The SBML sources ship inside the wheel and are reached with
# importlib.resources, so an installed package carries its own models rather
# than looking for a sibling checkout.
"ichnos.models" = ["*.sbml", "*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
