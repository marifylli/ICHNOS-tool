# Runs the test suite on every push and merge request (mirrors .github/workflows/tests.yml).
# The iGEM GitLab runners are Linux ARM (aarch64). tellurium cannot be installed there
# (one of its dependencies, python-libnuml, has no ARM wheels), so the model is loaded
# through libroadrunner directly; ichnos.simulate.load_model does this when tellurium is
# absent, and te.loadSBMLModel is exactly roadrunner.RoadRunner, so the model is the same.
stages:
  - test

tests:
  stage: test
  image: python:3.12
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgl1 libglib2.0-0 > /dev/null
    - python -m pip install -q --upgrade pip
    - python -m pip install -q --prefer-binary -e ".[image,dev]" python-libsbml PyYAML libroadrunner
  script:
    - python -m pytest -q
