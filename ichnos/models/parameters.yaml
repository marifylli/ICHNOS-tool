        value: 0.12
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      K_R:
        value: 0.44
        units: "MWDERIVEDUNIT_nanomole__liter"
        status: inherited
        source: null
      n:
        value: 4
        units: "dimensionless"
        status: inherited
        source: null
      P_min:
        value: 0.0056
        units: "dimensionless"
        status: inherited
        source: null
      mu:
        value: 0.35
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      Kd_TIP_TetR:
        value: 0.25
        units: "MWDERIVEDUNIT_nanomole__liter"
        status: inherited
        source: null
      S_ox:
        value: 400
        units: "MWBUILTINPREFIX_micro_MWBUILTINUNIT_molarity"
        status: inherited
        source: null
        note: "constant: there is no clearance rate rule, so stress never decays"
      K_act_ox:
        value: 208
        units: "MWBUILTINPREFIX_micro_MWBUILTINUNIT_molarity"
        status: fit_summary
        source: "Ichnos_PULSE/docs/oxidative_model_manifest.md @ e66de65c; Delaunay et al. 2000, Fig. 2C"
        note: >-
          Recorded baseline summary of window (218.9 uM) and unmix
          (198.2 uM) fits to simulated A_ox at 5 min.
          Original fitting used constant S_ox, k_on_ox=50/h,
          k_off_ox=150/h and d_x_ox=0.6/h.
          The source manifest reports a refit of the stored data columns
          using k_off_ox=160/h and d_x_ox=0.5/h.
          This did not repeat the original densitometry.
          Historical unmix output remains frozen because of reported
          reproducibility differences with scipy.nnls.
          The committed baseline value is retained.
      n_ox:
        value: 2.75
        units: "dimensionless"
        status: fit_summary
        source: "Ichnos_PULSE/docs/oxidative_model_manifest.md @ e66de65c; Delaunay et al. 2000, Fig. 2C"
        note: >-
          Recorded baseline summary of window (2.97) and unmix (2.54)
          fits to simulated A_ox at 5 min.
          Original fitting used constant S_ox, k_on_ox=50/h,
          k_off_ox=150/h and d_x_ox=0.6/h.
          The source manifest reports a refit of the stored data columns
          using k_off_ox=160/h and d_x_ox=0.5/h.
          This did not repeat the original densitometry.
          Historical unmix output remains frozen because of reported
          reproducibility differences with scipy.nnls.
          The committed baseline value is retained.
      beta_basal_ox:
        value: 5
        units: "MWDERIVEDUNIT_nanomole__liter__hour"
        status: inherited
        source: null
        note: "beta_max_ox/beta_basal_ox = 23.6; corrected from 5 after a source-mixing error"
      beta_max_ox:
        value: 118
        units: "MWDERIVEDUNIT_nanomole__liter__hour"
        status: inherited
        source: null
        note: "beta_max_ox/beta_basal_ox = 23.6; corrected from 5 after a source-mixing error"
      k_deg_TIP:
        value: 1
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
        note: "shared across variants (same TIP coding sequence); cross-variant equality is checked"
      k_on_ox:
        value: 50
        units: "MWDERIVEDUNIT_1__hour"
        status: model_convention
        source: "Ichnos_PULSE/docs/oxidative_model_manifest.md @ e66de65c; MASTER section 13"
        note: >-
          Fixed modelling convention, not an independently fitted value.
          The source documentation reports that k_on_ox is not
          independently identifiable from k_off_ox at steady state.
      k_off_ox:
        value: 160
        units: "MWDERIVEDUNIT_1__hour"
        status: swept
        source: "Ichnos_PULSE/docs/oxidative_model_manifest.md @ e66de65c; Delaunay et al. 2000, Fig. 2B; MASTER section 12"
        note: >-
          Selected from the R x d_x grid scan using the t50 criterion
          and temporal response shape.
          Not obtained from a joint fit with K_act_ox and n_ox.
          Retained as the committed baseline value.
      k_x_ox:
        value: 1
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      d_x_ox:
        value: 0.5
        units: "MWDERIVEDUNIT_1__hour"
        status: swept
        source: "Ichnos_PULSE/docs/oxidative_model_manifest.md @ e66de65c; Delaunay et al. 2000, Fig. 2B; MASTER section 12"
        note: >-
          Selected from the same R x d_x grid scan as k_off_ox.
          Selection used temporal plateau and t50 behaviour.
          Not obtained from a joint fit with K_act_ox and n_ox.
          Retained as the committed baseline value.
      a_Reporter:
        value: 50
        units: "MWDERIVEDUNIT_nanomole__liter__hour"
        status: inherited
        source: null
      m:
        value: 7.39
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      m1:
        value: 2.46
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      m2:
        value: 1.37
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      k_deg_Reporter:
        value: 0.01
        units: "MWDERIVEDUNIT_1__hour"
        status: inherited
        source: null
      E:
        value: 0.173
        units: "dimensionless"
        status: inherited
        source: null
      f:
        value: 1
        units: "dimensionless"
        status: inherited
        source: null
        note: "FRET/instrument scale on Measured_Ratio_RG; recovering Red from the ratio needs f, not ratio*Green"
      eps:
        value: 1e-09
        units: "MWDERIVEDUNIT_nanomole__liter"
        status: inherited
        source: null
    governed:
      # Set by rules or initial assignments in the model. A profile that
      # tried to assign these would be overwritten at runtime, or would
      # change the circuit structure.
      P: assignmentRule
      u_w: assignmentRule
      A_ox: rateRule
      X_ox: rateRule
      Total_red_pool: assignmentRule
      b_fret: assignmentRule
      Observed_Green: assignmentRule
      Ratio_RG_FRET: assignmentRule
      Measured_Ratio_RG: assignmentRule
    initial_state:
      # Every state starts at zero in the source SBML. A run from these
      # initial conditions is an artifact, not a biological baseline --
      # pre-equilibrate at zero stress first (see ichnos/protocol.py).
      TetR_active: 0.0
      TIP: 0.0
      TetR_TIP_complex: 0.0
      Reporter_dark_green: 0.0
      Reporter_green: 0.0
      Reporter_dark_red: 0.0
      Reporter_intermediate: 0.0
      Reporter_red: 0.0

