# Parameter profiles for the ICHNOS merged model.
#
# A profile is a COMPLETE, EXECUTABLE configuration of one variant -- every
# free parameter it needs, at once. Profiles are not grouped by where their
# numbers came from, and values from different profiles are never mixed: a
# profile is selected whole or not at all.
#
# IMPORTANT, and the reason every entry carries its own provenance: the
# "default" profile below is NOT the result of one joint fit. It is the set
# of values currently embedded in the source SBML, and those values reached
# the model by different routes -- some fitted to a published figure, some
# chosen by sweeping for a target shape, some simply inherited from the
# submodel author without a recorded source. The set is internally consistent
# in the sense that it runs and reproduces today's behaviour. It is not a
# jointly identified parameter estimate, and no uncertainty on it is implied.
#
# Generated from the merged model, so applying "default" is a no-op by
# construction. tests/model/test_parameter_profiles.py asserts exactly that.
#
# Status values:
#   fitted            estimated against named published data
#   swept             chosen by scanning for a target behaviour, not fitted
#   non_identifiable  not determined by the data on its own
#   inherited         carried over from the source SBML with no recorded
#                     derivation; NOT a claim that the value is arbitrary,
#                     only that this repository cannot cite its origin
#
# Rule-governed quantities are listed separately under `governed:` for each
# variant and MUST NOT be set by a profile. P in particular is an
# assignment-rule parameter: the builder wires the reporter onto the dynamic
# P from TIP-TetR and sets aside the reporter's own static P = 0.5. Turning P
# into a constant would silently change the circuit.

schema_version: 1


